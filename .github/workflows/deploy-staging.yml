name: Deploy MyGreekTax Brain to AWS Lambda (staging)

# Mirrors deploy.yml exactly except for the trigger branch and the target
# function. That is deliberate: staging is only a useful rehearsal if it
# packages and deploys the same way production does. If deploy.yml changes,
# change this file with it.
#
# Requires the Lambda function mygreektax-brain-staging to exist in
# eu-north-1, with its own execution role and Bedrock access.
#
# It runs on a push to the staging branch, or on a manual dispatch from the
# Actions tab, where the ref you pick is the code that gets deployed. It
# cannot run on main, and its only AWS call names the staging function, so it
# cannot reach production either way.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# Kept identical to deploy.yml, per the note above. id-token: write is what
# lets the runner request the OIDC token AWS exchanges for credentials.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install production dependencies
      working-directory: src
      run: npm install --omit=dev

    - name: Package deployment archive
      working-directory: src
      run: zip -r ../deployment.zip index.js summary-parsing.js package.json node_modules

    # OIDC, same role as production. The role's policy names both functions,
    # and this workflow's only AWS call names the staging one, so the branch
    # separation still decides which function is touched.
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::552648196447:role/GitHubActionsDeployBrain
        aws-region: eu-north-1

    - name: Push Zip to AWS Lambda
      run: |
        aws lambda update-function-code \
          --function-name mygreektax-brain-staging \
          --zip-file fileb://deployment.zip
