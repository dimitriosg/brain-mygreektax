name: Deploy MyGreekTax Brain to AWS Lambda (staging)

# Mirrors deploy.yml exactly except for the trigger branch and the target
# function. That is deliberate: staging is only a useful rehearsal if it
# packages and deploys the same way production does. If deploy.yml changes,
# change this file with it.
#
# Requires the Lambda function mygreektax-brain-staging to exist in
# eu-north-1, with its own execution role and Bedrock access. Until it does,
# this workflow only runs when someone pushes to the staging branch, and it
# fails at the last step without touching production.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install production dependencies
      working-directory: src
      run: npm install --omit=dev

    - name: Package deployment archive
      working-directory: src
      run: zip -r ../deployment.zip index.js package.json node_modules

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1

    - name: Push Zip to AWS Lambda
      run: |
        aws lambda update-function-code \
          --function-name mygreektax-brain-staging \
          --zip-file fileb://deployment.zip
